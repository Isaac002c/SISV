# =============================================================================
# SISV — Stack de deploy ISOLADA. Convive na mesma VPS com outros sistemas
# (inclusive o Nexos) SEM compartilhar nada: containers, rede, volumes e banco
# são todos `sisv-*`. O Postgres NÃO publica porta no host.
#
# IMPORTANTE: nunca aponte o SISV para o banco/volume de outro sistema.
#
# Subir (banco + backend):
#   docker compose -f deploy/sisv-docker-compose.yml up -d postgres backend
# Frontend (se não usar Vercel):
#   docker compose -f deploy/sisv-docker-compose.yml up -d frontend
# Proxy/SSL (quando houver domínio) — profile "proxy":
#   docker compose -f deploy/sisv-docker-compose.yml --profile proxy up -d nginx
#
# CRÍTICO: o `name: sisv` abaixo fixa o NOME DO PROJETO. Sem ele, o Compose usa o
# nome da pasta ("deploy"), que colide com outras stacks cujo compose também fica
# em uma pasta "deploy" (ex.: o Nexos em /opt/nexos/deploy) — e o `up` acabaria
# recriando/substituindo os containers do outro sistema. Nunca remova esta linha.
# =============================================================================

name: sisv

services:

  postgres:
    image: postgres:16-alpine
    container_name: sisv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sisv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sisv}
    volumes:
      - sisv-postgres-data:/var/lib/postgresql/data
    # SEM ports: acesso apenas pela rede interna sisv-network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sisv} -d ${POSTGRES_DB:-sisv}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [sisv-network]
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sisv-backend
    restart: unless-stopped
    # Crie deploy/sisv-backend.env a partir de sisv-backend.env.example (chmod 600).
    env_file: ./sisv-backend.env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - sisv-backend-uploads:/app/uploads
    # Porta só no localhost da VPS (smoke test enquanto não há proxy/domínio).
    ports:
      - "127.0.0.1:${SISV_BACKEND_PORT:-8097}:5000"
    healthcheck:
      # /health = liveness (não toca no banco). Use /ready para prontidão completa.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [sisv-network]
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  # ── Frontend (alternativa ao Vercel) ────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        BACKEND_URL: http://backend:5000
    container_name: sisv-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SISV_FRONTEND_PORT:-8098}:3001"
    networks: [sisv-network]
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  # ── Cloudflare Tunnel NOMEADO — publica a API em HTTPS sem abrir porta ──────
  # Publica o backend em https://api-sisv.chronostek.com.br SEM expor porta no
  # host (80/443 já são usados por outras stacks desta VPS).
  #
  # A rota é configurada no painel Cloudflare (Zero Trust → Networks → Tunnels):
  #   Public hostname: api-sisv.chronostek.com.br → Service: http://sisv-backend:5000
  #
  # O token fica em deploy/sisv-tunnel.env (TUNNEL_TOKEN=..., chmod 600, fora do
  # git). O cloudflared alcança o backend pela rede interna sisv-network — nunca
  # por 127.0.0.1, que dentro do container é o próprio container.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: sisv-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: ./sisv-tunnel.env
    depends_on:
      backend:
        condition: service_healthy
    networks: [sisv-network]
    logging: { driver: "json-file", options: { max-size: "10m", max-file: "3" } }

  # ── Proxy/SSL (profile "proxy") — apenas com domínio próprio e portas livres ──
  nginx:
    image: nginx:1.27-alpine
    container_name: sisv-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "${SISV_HTTP_PORT:-8090}:80"
      - "${SISV_HTTPS_PORT:-8445}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - sisv-certs:/etc/letsencrypt:ro
      - sisv-webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [sisv-network]
    logging: { driver: "json-file", options: { max-size: "5m", max-file: "2" } }

  certbot:
    image: certbot/certbot:latest
    container_name: sisv-certbot
    profiles: ["proxy"]
    volumes:
      - sisv-certs:/etc/letsencrypt
      - sisv-webroot:/var/www/certbot

volumes:
  sisv-postgres-data:   { name: sisv-postgres-data }
  sisv-backend-uploads: { name: sisv-backend-uploads }
  sisv-certs:           { name: sisv-certs }
  sisv-webroot:         { name: sisv-webroot }

networks:
  sisv-network:
    name: sisv-network
