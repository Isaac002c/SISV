services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sisv_test
      POSTGRES_PASSWORD: sisv_test_only
      POSTGRES_DB: sisv_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisv_test -d sisv_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
